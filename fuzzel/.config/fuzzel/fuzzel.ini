[main]
font=FiraCode Nerd Font:pixelsize=13:weight=bold
prompt="  "
placeholder=Search apps
icon-theme=Tokyonight-Dark
icons-enabled=yes
terminal=kitty -e
match-mode=fzf
match-counter=yes
width=40
lines=8
horizontal-pad=24
vertical-pad=20
inner-pad=16
line-height=34
layer=overlay
exit-on-keyboard-focus-loss=yes

# Glass: translucent tint over the compositor blur (layer namespace "launcher").
# Clean mode has no blur, so ~/.config/scripts/launcher overrides the background.
[colors]
background=1e1e2e85
text=cdd6f4d9
prompt=cba6f7ff
placeholder=a6adc8ff
input=cdd6f4ff
match=cba6f7ff
selection=ffffff24
selection-text=cdd6f4ff
selection-match=94e2d5ff
counter=a6adc8ff
# Liquid Glass specular rim
border=ffffff47

[border]
width=1
radius=28
selection-radius=18
