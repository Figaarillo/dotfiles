[main]
font=FiraCode Nerd Font:pixelsize=13:weight=bold
prompt="  "
placeholder=Search apps
icon-theme=Tokyonight-Dark
icons-enabled=yes
terminal=kitty -e
match-mode=fzf
match-counter=yes
width=40
lines=8
horizontal-pad=24
vertical-pad=20
inner-pad=16
line-height=34
layer=overlay
exit-on-keyboard-focus-loss=yes

# Glass: translucent tint over the compositor blur (layer namespace "launcher").
# Clean mode has no blur, so ~/.config/scripts/launcher overrides the background.
[colors]
background=1e1e2e99
text=cdd6f4cc
prompt=cba6f7ff
placeholder=9399b2ff
input=f5f5f7ff
match=cba6f7ff
selection=ffffff1f
selection-text=ffffffff
selection-match=94e2d5ff
counter=9399b2ff
border=ffffff26

[border]
width=1
radius=20
selection-radius=12
