# Font family
# font_family               OperatorMonoSSmLig Nerd Font
# font_family               FiraCode Nerd Font
# font_family               JetBrainsMono Nerd Font
font_family               CaskaydiaCove Nerd Font
bold_font                 CaskaydiaCove Nerd Font
italic_font               VictorMono NFM Bold Italic
bold_italic_font          VictorMono NFM Bold Italic

# Font size
font_size        11

force_ltr yes

# Disable ligature under cursor to see actual chars
disable_ligatures never

# Replaces deprecated adjust_line_height
modify_font cell_height 130%

# Sizes of the lines used for the box drawing Unicode characters. Thin, normal, thick, and very thick lines
box_drawing_scale 0.001, 1, 1.5, 2

# No symbol_map needed: kitty >= 0.36 bundles Nerd Font symbols and draws
# box-drawing/powerline glyphs natively (mapping them to a font caused gaps).
# Troubleshoot with: kitty --debug-font-fallback
