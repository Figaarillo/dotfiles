# ########################################################### #
#                            RULES                            #
# ########################################################### #


# ==================== FLOATY WINDOWS ==================== #
        windowrule {
            name = floaty-window
            match:title = ^(floaty_window)$
            float = true
        }

        windowrule {
            name = floaty-big
            match:title = ^(floaty_big)$
            float = true
            size = 900 600
            center = true
            animation = popin
        }

        windowrule {
            name = floaty-middle
            match:title = ^(floaty_middle)$
            float = true
            size = 660 486
            animation = popin
        }

        windowrule {
            name = floaty-small
            match:title = ^(floaty_small)$
            float = true
            size = 325 180
        }

        # Scratch terminal
        windowrule {
            name = scratch-term
            match:title = ^(scratch_term)$
            float = true
            size = 800 500
            center = true
            animation = popin
        }

        # ==================== SPOTIFY ==================== #
        windowrule {
            name = spotify
            match:class = ^(Spotify)$
            float = true
            size = 968 600
            center = true
            opacity = 0.95 0.95
        }

        # ==================== ZEN BROWSER ==================== #
        windowrule {
            name = zen-alpha
            match:class = ^(zen-alpha)$
            opacity = 0.97 0.97
        }

        windowrule {
            name = zen-beta
            match:class = ^(zen-beta)$
            opacity = 0.97 0.97
        }

        # ==================== FIREFOX ==================== #
        windowrule {
            name = firefox-sharing
            match:class = ^(firefox)$
            match:title = ^(Firefox — Sharing Indicator)$
            float = true
        }

        windowrule {
            name = firefox-opacity
            match:class = ^(firefox)$
            opacity = 0.97 0.97
        }

        windowrule {
            name = firefox-library
            match:title = ^(Library)$
            float = true
            center = true
        }

        # ==================== BRAVE ==================== #
        windowrule {
            name = brave-opacity
            match:class = ^(Brave-browser)$
            opacity = 0.95 0.95
        }

        # ==================== VSCODE ==================== #
        windowrule {
            name = vscode-opacity
            match:class = ^(Code)$
            opacity = 0.97 0.97
        }

        # ==================== VSCODIUM ==================== #
        windowrule {
            name = vscodium-opacity
            match:class = ^(vscodium)$
            opacity = 0.97 0.97
        }

        # ==================== KITTY ==================== #
        windowrule {
            name = kitty-opacity
            match:class = ^(kitty)$
            opacity = 0.96 0.96
        }

        # ==================== TELEGRAM ==================== #
        # windowrule {
        #     name = telegram
        #     match:class = ^(telegram)$
        #     float = true
        #     opacity = 0.9 0.9
        #     size = 1352 740
        #     center = true
        # }

        # ==================== NEOVIDE ==================== #
        windowrule {
            name = neovide-opacity
            match:class = ^(neovide)$
            opacity = 0.95 0.95
        }

        # ==================== THUNAR ==================== #
        windowrule {
            name = thunar-opacity
            match:class = ^(thunar)$
            opacity = 0.95 0.95
        }

        # ==================== NEMO ==================== #
        windowrule {
            name = nemo-opacity
            match:class = ^(nemo)$
            opacity = 0.95 0.95
        }

        # ==================== DISCORD & ALTERNATIVES ==================== #
        windowrule { name = discord-opacity; match:class = ^(discord)$; opacity = 0.95 0.95 }
        windowrule { name = webcord-opacity; match:class = ^(WebCord)$; opacity = 0.95 0.95 }
        windowrule { name = vesktop-opacity; match:class = ^(vesktop)$; opacity = 0.95 0.95 }
        windowrule { name = armcord-opacity; match:class = ^(armcord)$; opacity = 0.95 0.95 }

        # ==================== MPV ==================== #
        windowrule {
            name = mpv
            match:class = ^(mpv)$
            float = true
            size = 1280 720
            center = true
            opacity = 1.0 1.0
            idle_inhibit = focus
        }

        # ==================== IDLE INHIBIT ==================== #
        windowrule {
            name = firefox-idle
            match:class = ^(firefox)$
            idle_inhibit = fullscreen
        }

        windowrule {
            name = zen-alpha-idle
            match:class = ^(zen-alpha)$
            idle_inhibit = fullscreen
        }

        windowrule {
            name = brave-idle
            match:class = ^(Brave-browser)$
            idle_inhibit = fullscreen
        }

        # ==================== BLUETOOTH ==================== #
        # windowrule {
        #     name = blueman-float
        #     match:class = ^(blueman)$
        #     float = true
        #     opacity = 0.94 0.94
        # }
        # windowrule {
        #     name = blueman-mgr-float
        #     match:class = ^(blueman-manager)$
        #     float = true
        # }

        # ==================== WOFI ==================== #
        windowrule {
            name = wofi
            match:class = ^(wofi)$
            float = true
            stay_focused = true
            opacity = 0.85 0.85
        }

        # ==================== AMBEROL ==================== #
        windowrule {
            name = amberol
            match:class = ^(amberol)$
            float = true
            size = 670 635
            center = true
        }

        # ==================== GENERIC RULES ==================== #
        # Polkit
        windowrule {
            name = polkit
            match:class = ^(org.kde.polkit-kde-authentication-agent-1)$
            float = true
            opacity = 0.90 0.80
        }

        # PulseAudio/PipeWire
        windowrule {
            name = pavucontrol
            match:class = ^(pavucontrol)$
            float = true
            size = 800 600
            opacity = 0.90 0.80
        }

        # GTK theme selectors
        windowrule { name = qt5ct-opacity; match:class = ^(qt5ct)$; opacity = 0.95 0.95 }
        windowrule { name = nwg-look-opacity; match:class = ^(nwg-look)$; opacity = 0.95 0.95 }
        windowrule { name = lxappearance-float; match:class = ^(Lxappearance)$; float = true }
        windowrule { name = nemo-props-float; match:class = ^(nemo)$; match:title = ^(.*Properties)$; float = true }
        windowrule { name = nemo-preview-float; match:class = ^(Nemo-preview-start)$; float = true }
        # windowrule { name = rlr-float; match:class = ^(rlr)$; float = true }
        # windowrule { name = nm-conn-ed-float; match:class = ^(nm-connection-editor)$; float = true }
        # windowrule { name = gparted-float; match:class = ^(GParted)$; float = true }
        # windowrule { name = qimgv-float; match:class = ^(qimgv)$; float = true; center = true }

        # ==================== BASIC WINDOWS ==================== #
        # File roller
        windowrule {
            name = file-roller
            match:class = ^(file-roller)$
            float = true
            opacity = 0.95 0.95
        }

        # Generic dialogs
        windowrule { name = media-viewer; match:title = ^(Media viewer)$; float = true }
        windowrule { name = volume-control; match:title = ^(Volume Control)$; float = true; size = 640 400 }
        windowrule { name = pip; match:title = ^(Picture-in-Picture)$; float = true }
        windowrule { name = devtools; match:title = ^(DevTools)$; float = true }
        windowrule { name = mediainfo-gui; match:class = ^(mediainfo-gui)$; float = true }
        windowrule { name = file-progress; match:class = ^(file_progress)$; float = true }
        windowrule { name = confirm; match:class = ^(confirm)$; float = true }
        windowrule { name = dialog; match:class = ^(dialog)$; float = true }
        windowrule { name = download; match:class = ^(download)$; float = true; size = 640 400 }
        windowrule { name = notification; match:class = ^(notification)$; float = true }
        windowrule { name = error; match:class = ^(error)$; float = true }
        windowrule { name = confirmreset; match:class = ^(confirmreset)$; float = true }
        windowrule { name = open-file; match:title = ^(Open File)$; float = true; size = 640 400 }
        windowrule { name = save-file; match:title = ^(Save File)$; size = 640 400 }
        windowrule { name = branchdialog; match:title = ^(branchdialog)$; float = true }
        windowrule { name = confirm-replace; match:title = ^(Confirm to replace files)$; float = true }
        windowrule { name = file-op-progress; match:title = ^(File Operation Progress)$; float = true }
        windowrule { name = viewnior; match:class = ^(Viewnior)$; float = true }
        # windowrule { name = feh-float; match:class = ^(feh)$; float = true }
        # windowrule { name = pavucontrol-qt; match:class = ^(pavucontrol-qt)$; float = true }

        # ==================== JETBRAINS / INTELLIJ ==================== #
        # Fix focus issues when dialogs are opened or closed
        # windowrule {
        #     name = jb-windowdance
        #     match:class = ^(jetbrains-.*)$
        #     match:float = true
        #     window_dance = true
        # }

        windowrule {
            name = jb-splash
            match:class = ^(jetbrains-.*)$
            match:title = ^(splash)$
            match:float = true
            center = true
            no_focus = true
            border_size = 0
        }

        windowrule {
            name = jb-popups
            match:class = ^(jetbrains-.*)$
            match:title = ^( )$
            match:float = true
            center = true
            stay_focused = true
            border_size = 0
        }

        windowrule {
            name = jb-autocomplete
            match:class = ^(jetbrains-.*)$
            match:title = ^(win.*)$
            match:float = true
            no_focus = true
            border_size = 0
        }

        windowrule {
            name = jb-idea-center
            match:class = ^(jetbrains-idea)$
            center = true
        }

        # ==================== LIBRETRO / RETROARCH ==================== #
        windowrule {
            name = libretro-noborder
            match:class = ^(libretro.*)$
            match:title = ^( )$
            match:fullscreen = true
            border_size = 0
        }

        windowrule {
            name = retroarch-noborder
            match:class = ^(org.libretro.RetroArch)$
            match:title = ^( )$
            match:fullscreen = true
            border_size = 0
        }

        # ==================== LAYER RULES ==================== #
        layerrule = blur on, ignore_alpha 0, match:namespace waybar
        layerrule = blur on, ignore_alpha 0, match:namespace gtk-layer-shell

        # Notifications
        layerrule = blur on, ignore_alpha 0, match:namespace notifications

        # ==================== PERFORMANCE RULES ==================== #
        windowrule { name = steam-noblur; match:class = ^(steam)$; no_blur = true }
        windowrule { name = gamescope-noblur; match:class = ^(gamescope)$; no_blur = true }
