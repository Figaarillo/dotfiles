# ########################################################### #
# #                        ANIMATIONS                         #
# ########################################################### #

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.0
    bezier = winIn, 0.1, 1.0, 0.1, 1.0
    bezier = winOut, 0.3, 0, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 3, wind, slide
    animation = windowsIn, 1, 3, winIn, slide
    animation = windowsOut, 1, 2, winOut, slide
    animation = windowsMove, 1, 3, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 0, 30, liner, loop
    animation = fade, 1, 3, default
    animation = fadeIn, 1, 3, default
    animation = fadeOut, 1, 3, default
    animation = workspaces, 1, 3.5, wind
}
